packages:
  - .

nodeLinker: hoisted

# The Qoder SDKs' postinstall downloads their CLI worker runtime. It is
# optional — each SDK falls back to the system CLI on PATH — but allowing it
# here makes a dev install behave exactly like a user's `dsh plugin add`,
# which is the configuration worth testing against. The CodeBuddy SDK ships
# its CLI inside the package and has no install script.
allowBuilds:
  '@qodercn-ai/qodercn-agent-sdk': true
  '@qoder-ai/qoder-agent-sdk': true

minimumReleaseAgeExclude:
  - '@qoder-ai/qoder-agent-sdk@1.0.56'
  - '@tencent-ai/agent-sdk@0.3.289'
