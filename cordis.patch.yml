# The dsh-qoder-link bundle patch: activates the Qoder adapters (CN on
# `qoder-cn`, international on `qoder-intl`) as a profile layer row over the
# profile root. The user's profile cordis.patch.yml may address this row by id
# (`llm-qoder-cn`) to override any Config field, including the intl* ones.
- insert:
    - id: llm-qoder-cn
      name: 'dsh-qoder-link'
